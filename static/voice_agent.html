<!DOCTYPE html>
<!--
  static/voice_agent.html —— 级联 Pipeline 的浏览器端全双工通话页，由 ws_server.py 在 GET / 时原样返回。

  职责边界（本页只做这四件事，所有智能都在服务端）：
    1. 采集：麦克风 → 16kHz / 512 点（32ms）int16 帧
    2. 播放：24kHz int16 帧 → 抖动缓冲播放器
    3. 打断：收到 barge_in 立即丢弃已下发未播的音频
    4. Turn 闸门：只播当前已授权轮次的音频，避免"打断后旧音频又冒出来"

  协议：上行/下行共用 /ws/voice 一条 WebSocket —— ArrayBuffer 是音频，字符串是 JSON 控制帧。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Agent v3.0</title>
<link rel="stylesheet" href="/static/css/voice_agent.css">
</head>
<body>
<div class="app">

  <!-- ===== 顶栏：状态徽章 + 连接状态 ===== -->
  <div class="header">
    <h1>Voice Agent <span style="font-size:12px;color:var(--dim)">v3.0</span></h1>
    <div class="right">
      <span class="state-badge state-idle" id="stateBadge">IDLE</span>
      <span><span class="status-dot" id="statusDot"></span> <span id="statusText">Disconnected</span></span>
    </div>
  </div>

  <!-- ===== 主区：消息流 + 控制栏 ===== -->
  <div class="main">
    <div class="chat-area" id="chat"></div>
    <div class="controls">
      <button class="btn btn-call" id="btnCall">Start Call</button>
      <button class="btn btn-reset" id="btnReset">Reset</button>
    </div>
  </div>

  <!-- ===== 侧栏：延迟 / 模型 / RAG / 音频 / 接口 ===== -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>First Response Delay</h3>
      <div class="latency-bar" id="latencyBar">
        <div class="latency-seg" style="background:var(--cyan);width:25%" id="segASR">ASR</div>
        <div class="latency-seg" style="background:var(--purple);width:5%" id="segRAG">RAG</div>
        <div class="latency-seg" style="background:var(--accent);width:40%" id="segLLM">LLM</div>
        <div class="latency-seg" style="background:var(--yellow);width:30%" id="segTTS">TTS</div>
      </div>
      <div style="margin-top:6px">
        <div class="info-row"><span class="label">ASR</span><span class="value" id="valASR">—</span></div>
        <div class="info-row"><span class="label">RAG</span><span class="value" id="valRAG">—</span></div>
        <div class="info-row"><span class="label">LLM (1st sentence)</span><span class="value" id="valLLM">—</span></div>
        <div class="info-row"><span class="label">TTS TTFA</span><span class="value" id="valTTS">—</span></div>
        <div class="info-row"><span class="label"><b>First Response</b></span><span class="value" id="valFR">—</span></div>
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Models</h3>
      <div id="modelInfo"></div>
    </div>
    <div class="sidebar-section">
      <h3>RAG Context</h3>
      <div class="rag-box" id="ragBox">Waiting...</div>
    </div>
    <div class="sidebar-section">
      <h3>Audio</h3>
      <div class="info-row"><span class="label">Mic</span><span class="value" id="micStatus">Off</span></div>
      <div class="info-row"><span class="label">Turn</span><span class="value" id="turnCount">0</span></div>
      <div class="vu-meter"><div class="bar" id="vuBar"></div></div>
    </div>
    <div class="sidebar-section">
      <h3>API</h3>
      <div style="font-size:11px;color:var(--dim);font-family:monospace;line-height:1.8">
        WSS /ws/voice<br>GET /api/info<br>GET /api/metrics<br>GET /api/rag/query?q=<br>GET /api/rag/docs
      </div>
    </div>
  </div>

  <div class="footer">Voice Agent v3.0</div>
</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
